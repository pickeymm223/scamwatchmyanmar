<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Blog Post တင်ရန် — ScamWatch</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,"Noto Sans Myanmar",sans-serif;margin:0;background:#f1f5f9;color:#0f172a;padding:12px}
.card{max-width:720px;margin:0 auto;background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h1{font-size:1.15rem;margin:0 0 12px}
label{font-size:.85rem;font-weight:600;display:block;margin:12px 0 4px}
input[type=text],input[type=password]{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.toolbar button{padding:8px 10px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:8px;font-size:.95rem;cursor:pointer}
.toolbar button:active{background:#e2e8f0}
#editor{min-height:260px;border:1px solid #cbd5e1;border-radius:8px;padding:12px;font-size:1rem;line-height:1.7}
#editor:focus{outline:2px solid #2563eb}
#editor img{max-width:100%;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:7px 12px;border:1px solid #cbd5e1;border-radius:20px;font-size:.88rem;background:#f8fafc;cursor:pointer}
.chip.on{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
#publish{width:100%;margin-top:16px;padding:13px;background:#16a34a;color:#fff;border:0;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer}
#publish:disabled{background:#94a3b8}
#status{margin-top:10px;font-size:.92rem;min-height:1.4em;word-break:break-all}
#status.ok{color:#16a34a}
#status.err{color:#dc2626}
.hint{font-size:.82rem;color:#64748b;margin-top:4px}
a{color:#2563eb}
</style>
</head>
<body>
<div class="card">
<h1>📝 Blog Post တင်ရန်</h1>

<div id="gate">
<label>GitHub Token</label>
<input type="password" id="pat" placeholder="Token ထည့်ပါ (ပထမအကြိမ်သာ)" autocomplete="off">
<div class="hint">ဖုန်းထဲမှာပဲ သိမ်းထားမယ်၊ ဘယ်ကိုမှ မပို့ဘူး</div>
</div>

<label>ခေါင်းစဉ်</label>
<input type="text" id="title" placeholder="ဥပမာ — KBZPay လိမ်နည်းအသစ် သတိထားပါ">

<label>Label</label>
<div class="chips" id="chips"></div>
<input type="text" id="customLabel" placeholder="ကိုယ်ပိုင် label (ရှိရင်)" style="margin-top:6px">

<label>စာသား</label>
<div class="toolbar">
<button data-c="bold"><b>B</b></button>
<button data-c="italic"><i>I</i></button>
<button data-c="h2">H2</button>
<button data-c="h3">H3</button>
<button data-c="p">¶</button>
<button data-c="ul">• List</button>
<button data-c="ol">1. List</button>
<button data-c="link">🔗</button>
<button id="imgBtn">🖼️ ပုံ</button>
<input type="file" id="imgFile" accept="image/*" style="display:none">
</div>
<div id="editor" contenteditable="true"></div>
<div class="hint">ပုံထည့်ချင်တဲ့နေရာ ထိပြီး 🖼️ ပုံ နှိပ်ပါ</div>

<button id="publish">တင်မယ်</button>
<div id="status"></div>
</div>

<script>
const OWNER = "scamwatchmyanmar";
const REPO = "scamwatchmyanmar.github.io";
const BRANCH = "main";
const SITE = "https://scamwatchmyanmar.com";

const LABELS = ["သတိပေးချက်","လိမ်နည်းအသစ်","အသိပညာပေး","သတင်း","အမေးအဖြေ"];
const chipsEl = document.getElementById("chips");
const selected = new Set();
LABELS.forEach(l => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = l; b.type = "button";
  b.onclick = () => { selected.has(l) ? selected.delete(l) : selected.add(l); b.classList.toggle("on"); };
  chipsEl.appendChild(b);
});

const editor = document.getElementById("editor");
const patEl = document.getElementById("pat");
const statusEl = document.getElementById("status");
const savedPat = localStorage.getItem("sw_blog_pat");
if (savedPat) { patEl.value = savedPat; document.getElementById("gate").style.display = "none"; }

function setStatus(t, cls) { statusEl.textContent = t; statusEl.className = cls || ""; }
function getPat() {
  const p = patEl.value.trim();
  if (!p) { setStatus("GitHub Token ထည့်ပါ", "err"); return null; }
  return p;
}
function ghHeaders(pat) {
  return { "Authorization": "Bearer " + pat, "Accept": "application/vnd.github+json", "Content-Type": "application/json" };
}
function b64(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}
async function ghPut(pat, path, contentB64, message, sha) {
  const body = { message, content: contentB64, branch: BRANCH };
  if (sha) body.sha = sha;
  const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
    method: "PUT", headers: ghHeaders(pat), body: JSON.stringify(body)
  });
  if (r.status === 401) throw new Error("Token မှားနေတယ်");
  if (!r.ok) throw new Error("GitHub error " + r.status);
  return r.json();
}
async function ghGet(pat, path) {
  const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`, { headers: ghHeaders(pat) });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("GitHub error " + r.status);
  return r.json();
}
// ---- sanitizer (allowlist) ----
const ALLOWED = new Set(["p","h2","h3","b","strong","i","em","u","ul","ol","li","br","blockquote","a","img","hr"]);
function sanitize(html) {
  let s = String(html || "");
  s = s.replace(/<script[\s\S]*?<\/script\s*>/gi, "");
  s = s.replace(/<style[\s\S]*?<\/style\s*>/gi, "");
  s = s.replace(/<(iframe|object|embed|form|input|button|video|audio|source)[\s\S]*?(?:<\/\1\s*>|\/>|>)/gi, "");
  s = s.replace(/<\/?([a-zA-Z][a-zA-Z0-9]*)\b([^<>]*)>/g, (m, tag, attrs) => {
    tag = tag.toLowerCase();
    const closing = m.startsWith("</");
    if (!ALLOWED.has(tag)) return "";
    if (closing) return "</" + tag + ">";
    if (tag === "img") {
      const src = attrs.match(/\ssrc\s*=\s*("([^"]*)"|'([^']*)'|([^\s>]+))/i) || [];
      const url = (src[2] || src[3] || src[4] || "").trim();
      if (!/^(https?:\/\/|\/)/i.test(url)) return "";
      return '<img src="' + url.replace(/"/g, "&quot;") + '" loading="lazy">';
    }
    if (tag === "a") {
      const href = attrs.match(/\shref\s*=\s*("([^"]*)"|'([^']*)'|([^\s>]+))/i) || [];
      const url = (href[2] || href[3] || href[4] || "").trim();
      if (!/^(https?:\/\/|\/)/i.test(url)) return "<a>";
      return '<a href="' + url.replace(/"/g, "&quot;") + '" target="_blank" rel="noopener">';
    }
    return "<" + tag + ">";
  });
  return s;
}
function excerptOf(html, n) {
  const t = String(html).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
  return t.length > n ? t.slice(0, n) + "…" : t;
}
function makeSlug() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return "p" + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + "-" + Math.random().toString(36).slice(2, 8);
}

// ---- toolbar ----
document.querySelectorAll(".toolbar [data-c]").forEach(b => {
  b.type = "button";
  b.onclick = () => {
    editor.focus();
    const c = b.dataset.c;
    if (c === "h2" || c === "h3" || c === "p") document.execCommand("formatBlock", false, c);
    else if (c === "ul") document.execCommand("insertUnorderedList");
    else if (c === "ol") document.execCommand("insertOrderedList");
    else if (c === "link") { const u = prompt("Link URL:"); if (u) document.execCommand("createLink", false, u); }
    else document.execCommand(c);
  };
});

// ---- image upload ----
document.getElementById("imgBtn").onclick = () => document.getElementById("imgFile").click();
document.getElementById("imgFile").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  const pat = getPat(); if (!pat) return;
  if (f.size > 6 * 1024 * 1024) { setStatus("ပုံက 6MB ထက် ကြီးနေတယ်", "err"); return; }
  setStatus("ပုံ တင်နေတယ်…");
  try {
    const bytes = new Uint8Array(await f.arrayBuffer());
    const ext = (f.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 4) || "jpg";
    const name = "blog/images/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
    await ghPut(pat, name, b64(bytes), "blog image " + name);
    localStorage.setItem("sw_blog_pat", pat);
    document.getElementById("gate").style.display = "none";
    editor.focus();
    document.execCommand("insertImage", false, SITE + "/" + name);
    setStatus("ပုံ ထည့်ပြီးပြီ ✓", "ok");
  } catch (err) { setStatus("ပုံတင်မရဘူး: " + err.message, "err"); }
  e.target.value = "";
};

// ---- publish ----
document.getElementById("publish").onclick = async () => {
  const pat = getPat(); if (!pat) return;
  const title = document.getElementById("title").value.trim();
  const rawHtml = editor.innerHTML.trim();
  const custom = document.getElementById("customLabel").value.trim();
  const labels = [...selected]; if (custom) labels.push(custom);
  if (!title) { setStatus("ခေါင်းစဉ် ရေးပါ", "err"); return; }
  const html = sanitize(rawHtml);
  if (!html.replace(/<[^>]*>/g, "").trim()) { setStatus("စာသား ရေးပါ", "err"); return; }
  const btn = document.getElementById("publish");
  btn.disabled = true; setStatus("တင်နေတယ်…");
  try {
    const slug = makeSlug();
    const date = new Date().toISOString().slice(0, 10);
    const post = { slug, title: title.slice(0, 200), labels: labels.map(l => String(l).slice(0, 30)).slice(0, 5), date, html: html.slice(0, 200000) };
    const enc = new TextEncoder().encode(JSON.stringify(post));
    await ghPut(pat, "blog/posts/" + slug + ".json", b64(enc), "blog post " + slug);
    const existing = await ghGet(pat, "blog/posts.json");
    let index = { posts: [] };
    if (existing && existing.content) {
      try { index = JSON.parse(atob(existing.content.replace(/\n/g, ""))); } catch (e) { index = { posts: [] }; }
    }
    if (!Array.isArray(index.posts)) index.posts = [];
    index.posts.unshift({ slug, title: post.title, labels: post.labels, date, excerpt: excerptOf(html, 160) });
    index.posts = index.posts.slice(0, 200);
    const idxEnc = new TextEncoder().encode(JSON.stringify(index));
    await ghPut(pat, "blog/posts.json", b64(idxEnc), "blog index " + slug, existing ? existing.sha : undefined);
    localStorage.setItem("sw_blog_pat", pat);
    document.getElementById("gate").style.display = "none";
    const url = SITE + "/blog.html?p=" + slug;
    statusEl.innerHTML = "";
    setStatus("တင်ပြီးပြီ ✓ ၁ မိနစ်လောက် စောင့်ပြီးမှ ဖွင့်ကြည့်:", "ok");
    const a = document.createElement("a");
    a.href = url; a.textContent = url; a.target = "_blank";
    statusEl.appendChild(document.createElement("br"));
    statusEl.appendChild(a);
    document.getElementById("title").value = "";
    editor.innerHTML = "";
  } catch (err) { setStatus("တင်မရဘူး: " + err.message, "err"); }
  btn.disabled = false;
};
</script>
</body>
</html>
